name: DCE deploy to PR environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "The environment to deploy to (e.g. nonprod, prod)"
        default: nonprod
      branch:
        required: false
        type: string
        default: master
      release:
        required: false
        type: string
        default: none
      go_version:
        required: false
        type: string
        default: "1.21.6"
      terraform_version:
        required: false
        type: string
        default: "1.7.4"
      version_tag:
        required: false
        type: string
        default: master
      namespace:
        required: false
        type: string
        default: nonprod
    secrets:
      AWS_DEFAULT_REGION:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      DCE_NONPROD_HOSTNAME:
        required: true
      NOTIFY_EMAIL:
        required: true

jobs:
  TestAndBuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set environment variables
        run: |
          echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "BRANCH=${{ github.event.inputs.branch }}" >> $GITHUB_ENV
          echo "RELEASE=${{ github.event.inputs.release }}" >> $GITHUB_ENV
          echo "GO_VERSION=${{ github.event.inputs.go_version }}" >> $GITHUB_ENV
          echo "TERRAFORM_VERSION=${{ github.event.inputs.terraform_version }}" >> $GITHUB_ENV

      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ inputs.go_version }}

      - name: Set up Golang CI Tools
        run: ./scripts/install_ci.sh

      - name: Build Go executables
        run: make build

      - name: Create Release Artifacts
        run: |
          cd bin
          zip -r build_artifacts.zip .
          cd ..
          zip -r bin/terraform_artifacts.zip modules

      - name: Publish build artifacts (bin)
        uses: actions/upload-artifact@v4
        with:
          name: bin
          path: bin

      - name: Publish build artifacts (deploy_scripts)
        uses: actions/upload-artifact@v4
        with:
          name: deploy_scripts
          path: scripts

  Deploy:
    needs: [TestAndBuild]
    runs-on: ubuntu-latest
    environment: nonprod
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Configure namespace
      - name: Configure namespace
        run: |
          PR_NUMBER=""
          if [[ "${{ github.event.pull_request.number }}" != "" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          fi
          if [[ -z "$PR_NUMBER" && "${{ inputs.version_tag }}" =~ ^pr-[0-9]+$ ]]; then
            PR_NUMBER=$(echo "${{ inputs.version_tag }}" | sed 's/pr-//')
          fi
          if [[ -z "$PR_NUMBER" && "${{ inputs.namespace }}" =~ ^pr-[0-9]+$ ]]; then
            PR_NUMBER=$(echo "${{ inputs.namespace }}" | sed 's/pr-//')
          fi
          if [[ -z "$PR_NUMBER" && "${{ github.event_name }}" == "release" ]]; then
            PR_NUMBER=$(echo "${{ github.event.release.tag_name }}" | grep -oE 'pr-[0-9]+' | sed 's/pr-//')
            if [[ -z "$PR_NUMBER" ]]; then
              PR_NUMBER=$(echo "${{ github.event.release.body }}" | grep -oE '(PR-|#)[0-9]+' | head -n 1 | sed 's/PR-\|#//')
            fi
          fi
          if [[ -n "$PR_NUMBER" && "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            NS="github-pr-${PR_NUMBER}"
          else
            NS="cd"
          fi
          echo "namespace=${NS}" >> $GITHUB_ENV
          echo "${NS}" > ./namespace.txt

      # Step 3: Upload namespace file
      - name: Upload namespace file
        uses: actions/upload-artifact@v4
        with:
          name: namespace
          path: namespace.txt

      # Step 4: Verify Artifact Upload
      - name: Verify Artifact Upload
        run: |
          echo "Verifying artifacts before upload..."
          [ -f "./bin/build_artifacts.zip" ] && echo "✅ build_artifacts.zip exists" || echo "❌ build_artifacts.zip missing"
          [ -f "./bin/terraform_artifacts.zip" ] && echo "✅ terraform_artifacts.zip exists" || echo "❌ terraform_artifacts.zip missing"
          [ -f "./scripts/deploy.sh" ] && echo "✅ deploy.sh exists" || echo "❌ deploy.sh missing"
          [ -f "./scripts/restore_db.sh" ] && echo "✅ restore_db.sh exists" || echo "❌ restore_db.sh missing"

      # Step 5: Upload Build Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin
          path: ./bin/build_artifacts.zip

      # Step 6: Upload Terraform Artifacts
      - name: Upload Terraform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: terraform_artifacts
          path: ./bin/terraform_artifacts.zip

      # Step 7: Upload Deploy Script
      - name: Upload Deploy Script
        uses: actions/upload-artifact@v4
        with:
          name: deploy_scripts
          path: ./scripts/deploy.sh

      # Step 8: Upload Restore DB Script
      - name: Upload Restore DB Script
        uses: actions/upload-artifact@v4
        with:
          name: restore_db_scripts
          path: ./scripts/restore_db.sh

      # Step 9: Deploy Application Code
      - name: Deploy Application Code
        run: |
          aws sts get-caller-identity
          ./scripts/deploy.sh \
            /home/runner/work/dce/dce/bin/build_artifacts.zip \
            "${NAMESPACE}" \
            "${ARTIFACTS_BUCKET}"

      # Step 10: Cleanup the PR environment
      - name: Terraform destroy
        env:
          NAMESPACE: ${{ env.namespace }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TF_VAR_global_tags: ${{ vars.TF_VAR_GLOBAL_TAGS }}
        run: |
          set -ex
          export TF_VAR_namespace=$(cat ./namespace.txt)
          export TF_VAR_budget_notification_from_email="${NOTIFY_EMAIL}"
          export TF_VAR_global_tags='${{ vars.TF_VAR_GLOBAL_TAGS }}'
          export TF_VAR_required_bucket_prefix="${REQUIRED_BUCKET_PREFIX}"

          cd modules
          terraform init -input=false
          terraform destroy -auto-approve

      # Step 11: End the DCE lease
      - name: End DCE Lease
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -ex
          lease_id=$(cat ./lease_id.txt)
          namespace=$(cat ./namespace.txt)

          leases=$(./dce --config=dce.yml leases list -s Active)
          account_id=$(
            echo $leases | \
              jq -r \
                --arg Id "${lease_id}" \
                '.[] | select( .id==$Id ) | .accountId'
          )

          ./dce --config=./dce.yml leases end \
            -p ${namespace} \
            -a ${account_id}
  Release:
    needs: [Deploy]
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'published' || github.event.action == 'prereleased' }}
    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Download Build Artifacts
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bin
          path: ./bin

      # Step 3: Download Terraform Artifacts
      - name: Download Terraform Artifacts
        uses: actions/download-artifact@v4
        with:
          name: terraform_artifacts
          path: ./bin

      # Step 4: Download Deploy Script
      - name: Download Deploy Script
        uses: actions/download-artifact@v4
        with:
          name: deploy_scripts
          path: ./deploy_scripts

      # Step 5: Download Restore DB Script
      - name: Download Restore DB Script
        uses: actions/download-artifact@v4
        with:
          name: restore_db_scripts
          path: ./deploy_scripts

      # Step 6: Verify Downloaded Artifacts
      - name: Verify Downloaded Artifacts
        run: |
          echo "Verifying downloaded artifacts..."
          [ -f "./bin/build_artifacts.zip" ] && echo "✅ build_artifacts.zip found" || echo "❌ build_artifacts.zip missing"
          [ -f "./bin/terraform_artifacts.zip" ] && echo "✅ terraform_artifacts.zip found" || echo "❌ terraform_artifacts.zip missing"
          [ -f "./deploy_scripts/deploy.sh" ] && echo "✅ deploy.sh found" || echo "❌ deploy.sh missing"
          [ -f "./deploy_scripts/restore_db.sh" ] && echo "✅ restore_db.sh found" || echo "❌ restore_db.sh missing"

      # Step 7: Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            This release includes the following artifacts:
            - build_artifacts.zip
            - terraform_artifacts.zip
            - deploy.sh
            - restore_db.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 8: Upload Build Artifacts to Release
      - name: Upload Build Artifacts
        if: ${{ hashFiles('./bin/build_artifacts.zip') != '' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/build_artifacts.zip
          asset_name: build_artifacts.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 9: Upload Terraform Artifacts to Release
      - name: Upload Terraform Artifacts
        if: ${{ hashFiles('./bin/terraform_artifacts.zip') != '' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/terraform_artifacts.zip
          asset_name: terraform_artifacts.zip
          asset_content_type: application/zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 10: Upload Deploy Script to Release
      - name: Upload Deploy Script
        if: ${{ hashFiles('./deploy_scripts/deploy.sh') != '' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./deploy_scripts/deploy.sh
          asset_name: deploy.sh
          asset_content_type: text/x-shellscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 11: Upload Restore DB Script to Release
      - name: Upload Restore DB Script
        if: ${{ hashFiles('./deploy_scripts/restore_db.sh') != '' }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./deploy_scripts/restore_db.sh
          asset_name: restore_db.sh
          asset_content_type: text/x-shellscript
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}