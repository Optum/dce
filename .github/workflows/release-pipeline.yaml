
name: Nonprod Deployment Pipeline

on:
  workflow_run:
    workflows:
      - Nonprod PR Pipeline # Name of the build pipeline workflow
    types:
      - completed
  release:
    types:
      - prereleased
  push:
    tags:
      - '*'

jobs:
  deploy:
    #if: github.event.review.state == 'approved'
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_run' || github.event_name == 'push' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: nonprod
      version_tag: ${{ github.event.release.tag_name }}
      namespace: nonprod
    secrets:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DCE_NONPROD_HOSTNAME: ${{ secrets.DCE_NONPROD_HOSTNAME }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}