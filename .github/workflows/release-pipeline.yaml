
name: Nonprod Deployment Pipeline

on:
  workflow_run:
    workflows:
      - Nonprod PR Pipeline # Ensure this matches the name of the PR pipeline
    types:
      - completed # Trigger only when the PR pipeline completes successfully

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_run' || github.event_name == 'release' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: nonprod
      version_tag: ${{ github.event.release.tag_name }}
      namespace: nonprod
    secrets:
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DCE_NONPROD_HOSTNAME: ${{ secrets.DCE_NONPROD_HOSTNAME }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}